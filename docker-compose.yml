services:
  redpanda:
    image: redpandadata/redpanda:latest
    command: redpanda start --smp 1 --memory 512M --overprovisioned --node-id 0 --kafka-addr PLAINTEXT://0.0.0.0:9092,DOCKER://0.0.0.0:29092 --advertise-kafka-addr PLAINTEXT://localhost:9092,DOCKER://redpanda:29092
    ports: ["9092:9092"]

  console:
    image: docker.redpanda.com/redpandadata/console:latest
    environment:
      KAFKA_BROKERS: redpanda:29092
    ports: ["8085:8080"]
    depends_on:
      - redpanda

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: riskpulse
      POSTGRES_PASSWORD: riskpulse
    ports: ["5432:5432"]

  redis:
    image: redis:7
    ports: ["6379:6379"]
